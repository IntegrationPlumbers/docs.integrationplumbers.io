<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t">
  <title id="t">How mysql-onboard.sh moves an estate from the Oracle MySQL plug-in to the MySQL plug-in</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
      .lane { font-size: 15px; font-weight: 600; fill: #4b5563; }
      .mode { font-size: 17px; font-weight: 700; }
      .what { font-size: 12.5px; fill: #374151; }
      .box { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; rx: 6; }
      .target { fill: #fff; stroke: #9ca3af; stroke-width: 1; rx: 4; }
      .csv { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1; rx: 4; }
      .flow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .faint { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .small { font-size: 11.5px; fill: #4b5563; }
    </style>
  </defs>

  <!-- lanes -->
  <text x="20" y="34" class="lane">Oracle MySQL plug-in targets (the sources)</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db"/>
  <text x="20" y="300" class="lane">MySQL plug-in targets (the replacements)</text>
  <line x1="20" y1="308" x2="1180" y2="308" stroke="#d1d5db"/>

  <!-- source targets, upper lane -->
  <rect x="40" y="58" width="150" height="34" class="target"/><text x="115" y="80" text-anchor="middle" class="small">orders-db (omys)</text>
  <rect x="40" y="100" width="150" height="34" class="target"/><text x="115" y="122" text-anchor="middle" class="small">billing-db (omys)</text>
  <rect x="40" y="142" width="150" height="34" class="target"/><text x="115" y="164" text-anchor="middle" class="small">reports-db (omys)</text>

  <!-- the seven modes, middle band -->
  <rect x="226" y="186" width="126" height="78" class="box"/>
  <text x="289" y="212" text-anchor="middle" class="mode">export</text>
  <text x="289" y="232" text-anchor="middle" class="what">reads the sources</text>
  <text x="289" y="248" text-anchor="middle" class="what">writes inventory.csv</text>
  <rect x="364" y="186" width="126" height="78" class="box"/>
  <text x="427" y="212" text-anchor="middle" class="mode">review</text>
  <text x="427" y="232" text-anchor="middle" class="what">you edit the CSV</text>
  <text x="427" y="248" text-anchor="middle" class="what">and clear each flag</text>
  <rect x="502" y="186" width="126" height="78" class="box"/>
  <text x="565" y="212" text-anchor="middle" class="mode">apply</text>
  <text x="565" y="232" text-anchor="middle" class="what">creates xmys targets</text>
  <text x="565" y="248" text-anchor="middle" class="what">beside the sources</text>
  <rect x="640" y="186" width="126" height="78" class="box"/>
  <text x="703" y="212" text-anchor="middle" class="mode">verify</text>
  <text x="703" y="232" text-anchor="middle" class="what">waits for Up and</text>
  <text x="703" y="248" text-anchor="middle" class="what">License Active</text>
  <rect x="778" y="186" width="126" height="78" class="box"/>
  <text x="841" y="212" text-anchor="middle" class="mode">coexist</text>
  <text x="841" y="232" text-anchor="middle" class="what">both plug-ins run</text>
  <text x="841" y="248" text-anchor="middle" class="what">until you are ready</text>
  <rect x="916" y="186" width="126" height="78" class="box"/>
  <text x="979" y="212" text-anchor="middle" class="mode">associate</text>
  <text x="979" y="232" text-anchor="middle" class="what">attaches the five</text>
  <text x="979" y="248" text-anchor="middle" class="what">compliance standards</text>
  <rect x="1054" y="186" width="126" height="78" class="box"/>
  <text x="1117" y="212" text-anchor="middle" class="mode">retire</text>
  <text x="1117" y="232" text-anchor="middle" class="what">deletes a source once</text>
  <text x="1117" y="248" text-anchor="middle" class="what">its replacement is Up</text>

  <!-- arrows between modes -->
  <line x1="352" y1="225" x2="362" y2="225" class="flow"/>
  <line x1="490" y1="225" x2="500" y2="225" class="flow"/>
  <line x1="628" y1="225" x2="638" y2="225" class="flow"/>
  <line x1="766" y1="225" x2="776" y2="225" class="flow"/>
  <line x1="904" y1="225" x2="914" y2="225" class="flow"/>
  <line x1="1042" y1="225" x2="1052" y2="225" class="flow"/>

  <!-- the CSV between export and review -->
  <rect x="300" y="112" width="116" height="40" class="csv"/>
  <text x="358" y="137" text-anchor="middle" class="small">inventory.csv</text>
  <line x1="289" y1="186" x2="330" y2="153" class="flow"/>
  <line x1="386" y1="153" x2="427" y2="186" class="flow"/>

  <!-- export reads the sources; retire deletes them -->
  <path d="M 190 117 C 230 117, 230 160, 263 186" class="faint"/>
  <path d="M 1117 186 C 1117 56, 420 56, 195 76" class="faint"/>
  <text x="910" y="152" text-anchor="middle" class="small">retire runs last and deletes a source only after its replacement verified Up</text>

  <!-- replacement targets, lower lane -->
  <rect x="520" y="324" width="150" height="34" class="target"/><text x="595" y="346" text-anchor="middle" class="small">orders-db (xmys)</text>
  <rect x="520" y="366" width="150" height="34" class="target"/><text x="595" y="388" text-anchor="middle" class="small">billing-db (xmys)</text>
  <rect x="700" y="324" width="150" height="34" class="target"/><text x="775" y="346" text-anchor="middle" class="small">reports-db (xmys)</text>
  <line x1="565" y1="264" x2="575" y2="322" class="flow"/>
  <line x1="703" y1="264" x2="723" y2="322" class="faint"/>
  <line x1="979" y1="264" x2="879" y2="330" class="faint"/>
</svg>
