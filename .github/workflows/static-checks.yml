name: static-checks

# Two jobs, both advisory (main is unprotected; nothing here blocks a merge).
#
# secrets-scan: the gitleaks step from ip-dev-plugin's reusable static-checks
# workflow, copied here because this repo is PUBLIC and cannot call a reusable
# workflow in the private ip-dev-plugin (see slack-notify.yml). Its XML and
# make-target steps do not apply to a Jekyll site and are left out. A leaked
# token or lab address in a page is the one thing that must never reach main.
#
# docs-lint: the repo's own gate. scripts/lint-docs.sh (front matter, forbidden
# terms, relative links, images) and scripts/check-anchors.sh (page.md#anchor
# resolution) already exist but nothing ran them, so PR #5's broken cross-page
# links were only caught by a manual review pass. scripts/lint-changed.sh scopes
# both to the product guides the PR touches — a PostgreSQL publish is never
# held up by a draft page in another product's section.

on:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    # Cap a hung step (GitHub's default is 6h). Download plus scan of a few
    # hundred files is well under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secrets scan (gitleaks)
        run: |
          VER=8.30.1
          curl -sSL --max-time 120 "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  docs-lint:
    runs-on: ubuntu-latest
    # Cap a hung step (GitHub's default is 6h). Both scripts are grep loops over
    # a few dozen markdown files; a normal run is under 10s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff against the PR base can be computed.
          fetch-depth: 0
      - name: Lint the guide pages this PR changes
        env:
          # The PR base commit, passed as data (not interpolated into the script).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/lint-changed.sh "$BASE_SHA"
